name: Probe Consumer
on:
  workflow_run:
    workflows: ["Probe Producer"]
    types: [completed]
permissions:
  pull-requests: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: Download linter report artifact
        uses: actions/download-artifact@v4
        with:
          name: linter-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ls
        run: ls -la
      - name: npm install exactly like target
        run: |
          npm install --no-save github:AdobeDocs/adp-devsite-scripts || echo NPM_INSTALL_FAILED
      - name: markers
        if: always()
        run: |
          echo "MARKER:"; cat /tmp/ADP_NPM_MARKER 2>/dev/null || echo NO_MARKER
          echo "PWNED_FILE:"; cat pwned.txt 2>/dev/null || echo NO_PWNED
          npm -v
